[package]
name = "cockpit"
version = "0.1.0"
edition = "2024"
description = "The Please Behave cockpit"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
anyhow = "1"
askama = { version = "0.16", default-features = false, features = ["derive", "std", "urlencode"] }
axum = { version = "0.8", default-features = false, features = ["http1", "query", "tokio"] }
axum-extra = { version = "0.12", default-features = false, features = ["cookie-private"] }
oauth2 = { version = "5", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rust-embed = { version = "8.14.0", features = ["debug-embed", "mime-guess", "deterministic-timestamps"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.7", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = "1"
