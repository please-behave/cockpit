id: REQ-0027
name: Link Results to Registered Versions
description: >-
  When an attestation result carries a rule identity and version and the
  ledger's verification establishes that the version is registered, the
  Cockpit links the displayed version to that identity's rule detail and
  brings that version into view. The link uses the complete identity and
  preserves the reported verification and outcome.
rationale: >-
  Viewers can inspect the registered definition associated with the result.
decisions:
  - DEC-0001
  - DEC-0002
  - why:DEC-0010
  - why:DEC-0013
