id: REQ-0034
name: Current Deployments
area: deployments
description: >-
  The Deployments tab shows the ledger's current deployment for each target owner,
  target name and canonical subject repository. It reads every page through CON-0013.
  The visually hidden Deployments caption names both the table and its scroll
  region for assistive technology. The table shows one row per deployment.
  It uses the repository reference of REQ-0017 in the row when grouped by
  target and in the group header when grouped by repository. Each row links a recorded release version to REQ-0032,
  shows an unrecorded version as plain text with
  "Release not recorded", or shows the first seven characters of the reported
  commit for a commit-only deployment. Repository, target, version and commit
  values expose their full text in a tooltip when shortened or clipped, following
  REQ-0016.
  The target identity includes the owner and name, shown in the group header
  when grouped by target and in the row when grouped by repository. Each row
  shows relative ledger receipt time labeled "Reported", with the exact local
  time in an accessible popup. Evidence uses the outcome wording of REQ-0016,
  including "No evidence" for a known commit without evidence, or
  "Release not recorded" for an unresolved version, each with text and an icon.
  The row identity and evidence are the first two columns and fit without
  horizontal scrolling at 320 and 640 CSS pixels. Cells in each row share a
  baseline. A Rule Set summary shows the number of completed Rule Sets
  and opens a preview with a linked "Name · major.minor" chip for each set's
  bound version.
  Viewers can group by target (the default) or repository and combine filters
  for target, repository and evidence status. A status line reports the number
  of matching deployments. Group header
  rows show the worst visible status and its count as "N of M deployments"
  before the group name on one line. The group name truncates as needed and
  exposes its full value in a popup. On narrow screens the count shows
  "N of M" visually and retains the unit for assistive technology. Reported errors,
  failures and entries without evidence appear before passing entries.
  The view follows REQ-0004, REQ-0015 and REQ-0016.
rationale: >-
  Viewers can see which versions or commits were reported on each target and
  what evidence is available for them.
