id: REQ-0022
name: Incremental History Loading
description: >-
  The history loads 100 attestations first and a further page of 100 whenever
  the end of the loaded rows comes within one viewport height of the visible
  area. Each page asks for the attestations before the last loaded one. A page
  with fewer than 100 attestations ends the list, which then states that no
  older attestations exist. An attestation that arrives twice is shown once. A
  failed page keeps the loaded rows and shows an inline error with a retry
  action. Loading a page does not move the scroll position, and the loaded and
  end states are announced to assistive technology.
rationale: >-
  Viewers reach every attestation without waiting for the whole ledger and
  without losing their place.
decisions:
  - DEC-0013
