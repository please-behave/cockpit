id: REQ-0004
name: Safe Page Rendering
description: >-
  Lit templates escape all dynamic page output. Pages use no inline
  scripts or styles. Every HTTP response carries a Content-Security-Policy
  that allows scripts, styles, images and connections only from the same
  origin and blocks all other sources, framing, base URLs and form submission.
  Every response also carries protective headers for MIME sniffing and
  referrer disclosure.
rationale: >-
  Reported values and other external input must remain inert in a browser.
decisions:
  - DEC-0005
