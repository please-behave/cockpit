id: REQ-0021
name: Attestation History
area: attestations
description: >-
  The attestations page lists every attestation the ledger holds, one row per
  attestation, loaded through CON-0003 and shown newest first as the ledger
  returns them. A row shows the exact ledger receipt time with its time zone
  in the "Reported" column as a link to the attestation, the shortened repository
  name with the full value in a tooltip on its link to the repository page of
  REQ-0033, the first seven characters of the commit and the overall status.
  A tooltip and assistive technology
  expose the full value of a shortened commit. The commit links to github.com
  by the rule of DEC-0011. The columns never wrap and long values are
  truncated. The table scrolls with the page and keeps its column headers
  visible according to REQ-0018. The visually hidden Attestations caption
  names both the table and its scroll region for assistive technology. A ledger
  without attestations has an explicit empty state, and a failed first page
  shows the ledger-unavailable error with a retry action.
  The page has an entry in the navigation and refreshes by the rule of
  REQ-0020.
rationale: >-
  Viewers can find any attestation that was ever reported, not only the latest
  one of each repository.
decisions:
  - DEC-0001
  - DEC-0002
  - DEC-0008
  - DEC-0009
  - DEC-0011
