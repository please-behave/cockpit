id: REQ-0023
name: Theme Choice
area: identity
description: >-
  The application shell offers a square icon button next to the sign-out link.
  It shows a sun in dark mode and a moon in light mode. Its accessible name
  and tooltip state the action, `Switch to dark theme` or `Switch to light theme`.
  The tooltip is available on hover and keyboard focus.
  The icon is hidden from assistive technology. The button has a hover state
  and visible keyboard focus and can be activated with the keyboard. Until
  the viewer chooses, the cockpit follows the system theme, including a change
  of it while the page is open. A choice overrides the system theme on the
  whole document and its Shadow DOM components, and it is remembered across
  reloads and sessions. The sign-in page follows the same choice. A browser
  that blocks storage keeps the page working, and the choice then applies to
  the current page only.
rationale: >-
  Viewers read the cockpit in the theme they prefer, whatever their system
  setting is.
decisions:
  - DEC-0006
  - DEC-0015
