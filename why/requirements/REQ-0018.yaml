id: REQ-0018
name: Bounded Table Columns
area: identity
description: >-
  A table column can declare that it stays on one line at its natural width or
  that it takes the remaining width and truncates with an ellipsis. In the
  rules table of the detail view, the kind, status and verification columns
  never wrap. The rule column takes the remaining width and wraps its content.
  Data tables use the density and subtle dividers of REQ-0015. The page
  handles vertical scrolling. Column headers stay at the top of the viewport
  while their table is in view and scroll away at the end of the table. A table
  that exceeds the available width scrolls horizontally within its own region.
  A view may supply
  comparators for columns of a complete data set. Each sortable header
  contains a keyboard-operable button. The first activation sorts ascending
  and repeated activation of that column switches direction. The active
  header exposes its direction through aria-sort. Sorting leaves focus on
  the button, preserves the row set and group membership, and preserves the
  initial order of equal values in either direction. Tables displaying
  paged or limited results in ledger order have no sort controls.
  A column may expose a sort applied by the data source with a visible
  direction indicator and aria-sort on its header.
rationale: >-
  Short values stay readable on narrow screens while long values give way.
decisions:
  - DEC-0009
