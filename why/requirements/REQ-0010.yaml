id: REQ-0010
name: Reported Attestation Detail
description: >-
  The detail view loads the selected attestation through CON-0002. It shows
  the attestation ID, the reported commit, overall status and ledger receipt
  time under the full repository name. It shows rules in reported order with
  their shortened identifiers, kinds and statuses and identifies the outcomes
  as reported. An unknown attestation
  or malformed identifier has its own error state.
rationale: >-
  Viewers can inspect the outcomes that make up an attestation and distinguish
  the kinds of evidence behind them.
decisions:
  - DEC-0001
  - DEC-0002
  - why:DEC-0002
