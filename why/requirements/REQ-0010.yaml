id: REQ-0010
name: Reported Attestation Detail
area: attestations
description: >-
  The detail view loads the selected attestation through CON-0002 and shows
  the shortened repository name as defined in REQ-0017 as its headline.
  Below it, a fact strip shows the overall status, full reported commit,
  ledger receipt time, attestation ID and full repository name, in that order.
  Their labels are "Overall", "Commit", "Reported", "Attestation ID" and
  "Canonical name". Each label sits above its value. The facts sit side by
  side and wrap on narrow screens, and long values wrap within the available
  width. The commit uses the same link target rules as the dashboard and
  attestation history. The full repository name links to its page under REQ-0033.
  It follows REQ-0015 and shows a table of results with their kinds, statuses
  and verification. In reported binding order, each Rule Set group has a
  header row whose heading links to the bound version. The heading reads
  "Name · major.minor" with a muted version and no capsule. The full label
  remains available to assistive technology and wraps within the header.
  The view reads CON-0009 for the bound versions
  and matches results by source, path, rule ID and version. Results appear in
  every matching group in reported order by default. Viewers can sort the
  results within each group by rule, kind, status or verification under
  REQ-0018. When a bound version is unregistered, the header uses the set ID
  and version. When bindings exist, unmatched rules from the attestation
  repository appear under "Local rules". Other unmatched results, and all
  results when bindings are absent or empty, appear under "Unassigned". The
  Kind column shows each kind as a text badge. The overall outcome, rule
  kinds, rule statuses and verification values have value-specific
  explanations through the shared tooltip in REQ-0016. Explanations cover
  every value in CON-0002. Results with a registered
  version show the link described by REQ-0027. Other results show the plain
  local rule ID, or the run-scoped result ID when no rule identity was
  reported. The result row shows the rule label on one line where it fits.
  Its reported version and a short teaser of the description from CON-0002
  appear in a popup. Bound Rule Set heading links show a popup when a binding
  has a description. Teasers are plain text and end with an ellipsis when
  shortened. Popups open on hover,
  keyboard focus and tap, stay open while hovered or while focus is inside,
  and leave the detail links reachable. A link at the top returns to the
  dashboard or the attestations page, whichever the viewer opened the detail
  from. The router keeps that origin in the navigation
  state of the history entry, so it survives a reload, and the link goes back
  through the browser history like the browser's back button. A directly
  opened detail links to the dashboard. An unknown attestation or malformed
  identifier has its own error state.
rationale: >-
  Viewers can inspect the outcomes that make up an attestation and distinguish
  the kinds of evidence behind them.
decisions:
  - DEC-0001
  - DEC-0002
  - why:DEC-0002
