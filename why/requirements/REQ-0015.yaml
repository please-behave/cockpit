id: REQ-0015
name: Shared Visual Identity
area: identity
description: >-
  The cockpit uses the palette and contrast pairings defined by the shared
  visual identity consistently across views. The application shell and
  sign-in page use the shared logo, follow the browser's preferred color
  scheme, retain visible keyboard focus, and remain usable at 320 CSS pixels
  and 200 percent zoom. The shell exposes banner, navigation, main and
  contentinfo landmarks with a keyboard-accessible skip link. The footer
  follows the main content and reaches the bottom of the viewport on short
  pages. It wraps at 320 CSS pixels and uses muted text in both themes.
  It shows the repository owner's copyright notice and links the product
  name to the Please Behave GitHub organization without an opener or referrer.
  The link makes no external request before activation.
  The shell shows a Back to top button in the bottom corner after the
  viewer scrolls at least one viewport height, and hides it above that
  threshold. It leaves the footer link and all page content reachable.
  The button has an accessible name and visible keyboard focus in both
  themes and forced colors. It scrolls to the top and moves focus to the
  header, without animation when reduced motion is requested.
  The header presents adjoining, full-height navigation segments labeled
  "Please Behave Dashboard", "Attestations", "Releases", "Deployments", and
  "Rules" on the raised surface. At desktop widths and default zoom the header
  is at most 3rem high. The logo is at least 32 CSS pixels high.
  Segments wrap when space is constrained and stay free of underlines in every state.
  A compact toolbar directly below the header reserves a row on every view and
  provides space for view-specific controls and the refresh status of REQ-0020.
  At narrow widths the header uses tighter spacing and the reserved toolbar
  row fits the refresh controls without adding an empty row. The theme toggle,
  refresh button and interval menu share a size and surface treatment, with
  larger targets for coarse pointers. The interval menu uses a custom indicator
  and the same visible focus ring as the buttons in both themes and forced colors.
  The current segment uses the page surface and semibold text so it is
  distinguishable beyond color alone. It exposes aria-current="page",
  including on attestation detail, repository release history, release detail
  and rule detail routes.
  Hover slightly darkens the segment surface and adds a thin outline. Keyboard
  focus uses a thicker inset ring. The headline of the dashboard, attestations,
  releases, deployments and rules views is hidden visually but remains exposed
  to assistive technology and receives focus after navigation; detail pages show
  their headline.
  The theme control and sign-out link appear as separate actions at the end
  of the header, alongside the dashboard segment when the other segments
  wrap to the following row.
  Text links in content and tables are underlined. In both themes, link text
  contrasts with the page, raised, hover, badge, and panel surfaces. Primary
  and muted text contrast with hover, badge, and panel surfaces. Badge borders
  and control boundaries contrast with their own surface and adjacent surfaces.
  Decorative panel edges and dividers use the shared subtle border where
  backgrounds, spacing, or labels already identify the content. Each widget
  frame is a region named by its heading. Its heading level follows the view
  hierarchy. An optional header link and any interactive content in the
  widget are keyboard accessible and retain visible focus. Tables and
  widget views use a wider measure than detail views, and prose has a bounded
  line length. Shared section headings retain their native heading levels and
  support an optional count and keyboard-accessible link. Shared key-value lists
  expose native term and description pairs and reflow to fit the available width.
  Fine pointers use compact density and coarse pointers use
  comfortable density. Metadata is at least 0.75rem. Controls and standalone
  links provide targets at least 24 by 24 CSS pixels. Badges for the kinds
  `check` and `review`, for Blocking and for Non-blocking each have a
  distinct tone in both themes. Each tone pairs a tinted surface with text
  and a border of the same hue. Badge text and borders contrast with the badge
  surface and with the page and raised surfaces. The label always states the
  meaning. Badge styling uses only the badge tones or the plain badge look.
  Status colors are reserved for outcome indicators. The brand accent is
  reserved for small accents.
  In forced-colors mode, links use the browser's system link color on the
  system page background. Hover, badge, and panel surfaces use the system page
  background with the system text color for text and borders, including every
  badge tone. Navigation retains semibold current text, a hover outline, and
  an inset focus ring using system colors. In both themes and in forced-colors
  mode, normal text pairings meet 4.5:1 and meaningful boundaries meet 3:1
  under WCAG 2.2 AA.
  Interface icons use shared SVG artwork and inherit the surrounding text
  color. Icons paired with text are hidden from assistive technology.
  Standalone icons expose an accessible name.
rationale: >-
  A consistent, accessible identity helps viewers recognize and navigate the
  cockpit across devices and display preferences.
decisions:
  - DEC-0006
  - why:DEC-0009
