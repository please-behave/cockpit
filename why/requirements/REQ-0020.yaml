id: REQ-0020
name: Overview Refresh
area: operations
description: >-
  The dashboard, Attestations, Releases, Deployments and the registered Rules
  list refresh while the browser tab is visible. Each repeats its own reads
  at the viewer's refresh interval and when the tab becomes visible after
  being hidden for longer than that interval. The dashboard reads CON-0014
  together with the newest ten entries of CON-0003, CON-0010 and CON-0013.
  Attestations reads CON-0003, Releases reads CON-0010, Deployments reads
  CON-0013, and the Rules list reads CON-0004, CON-0007 and CON-0008.
  Overview pages make no refresh reads while the tab is hidden. Detail pages have no
  refresh control. Every view reserves the toolbar row below the header from the
  first render. After a successful read, refreshable views show a status line
  at the end of that row, with a refresh button
  named "Refresh", a small interval menu next to it and the text "Updated a few seconds ago", "Updated 1 minute
  ago", "Updated 2 minutes ago" and so on. The text stays on one line. The
  header and the start of the content stay in the same position across views,
  during loading, and as the age changes. The text updates at least every 10
  seconds without reading data, is no live region, and the exact time of the
  last read is available in a tooltip and as an accessible description. The
  button reads immediately, shows that it is working, accepts no further
  request meanwhile and restarts the interval. The interval menu is named
  "Refresh interval", exposes its current value, is operable by keyboard and
  offers 10 seconds, 30 seconds, 1 minute, 2 minutes and 5 minutes, with 5
  minutes as the default. The choice applies to all refreshable views, is kept
  in the browser's local storage under one key and falls back to the default
  when storage is missing or fails. A ring around the refresh icon fills slowly
  in the accent color towards the next refresh and empties after it, at every
  interval. The ring leaves a visible gap to the button edge and is legible
  in both themes and forced colors. It is decorative, uses no other animation
  and advances in steps when reduced motion is requested. Nothing else blinks or moves because of
  the interval. A refresh replaces content in place and keeps keyboard
  focus, scroll position, the list's sort order and loaded pages, and the
  dashboard's active status filter. Repository rows and chips are identified
  by repository key (the repository and platform from CON-0014). If a
  focused dashboard control disappears, return focus to the dashboard
  heading. A failed refresh keeps the data and shows a notice.
rationale: >-
  The views stay current without a reload and without interrupting the viewer,
  who can see how old the data is and read again on demand.
decisions:
  - DEC-0001
  - DEC-0022
