id: REQ-0019
name: Repository Dashboard
area: operations
description: >-
  The dashboard answers which repositories need attention and why, and
  provides a link to each repository in the ledger overview (CON-0014).
  The Repository health widget presents four compact status rows in a single
  column. At desktop widths Repository health and Needs attention stack beside
  a second column containing Recent activity and the Repository map. At
  narrow widths Repository health, Needs attention, Recent activity and the
  map appear in that order in a single column. At every width the Repository
  health widget uses the palette's blue accent surface for a stronger
  background than the other widgets in both themes. In forced colors it uses
  the system canvas and a thicker border. An overview without repositories
  shows an explicit empty state alongside the Repository health widget.
  The widget shows the oldest covering sync completion from the ledger as
  "Repository list synced" followed by the relative time. The exact local
  time is available in a tooltip and accessible description. When the
  heartbeat is stale, the widget shows a warning symbol, the word "stale"
  and the note "Statuses may be outdated". Without a completed heartbeat it
  says "The repository list has not been synced yet." The toolbar contains
  the refresh control described in REQ-0020. The dashboard follows REQ-0015
  in both themes and forced colors, with every status conveyed in text.

  Health is unknown (status-not-run) when the ledger state is unknown.
  Otherwise FAIL or ERROR verdicts and never integrated repositories are
  failed (status-failed). For the remaining repositories, current and pending
  are passed (status-passed) and overdue is warning (status-warning) before
  the last configured step and failed at the last step. The verdict is the
  overall result of the newest attestation containing check. The overview
  includes repositories without attestations and the ledger excludes archived
  repositories.

  Each status tile shows a symbol, count and text label for its health group
  across the full overview. Every tile links to the dashboard with
  status=failed, status=warning, status=not-run (unknown) or status=passed
  in the query. Its accessible name conveys the count and status. For
  nonzero counts, hover, keyboard focus and the first touch tap show the
  first three matching repository names in input order and "and N more"
  when more remain. The preview is also the link's accessible description.
  The next tap follows the link. A zero tile stays muted, uses the same
  pointer cursor and hover and focus styles as the other tiles, and
  offers no preview.

  The Needs attention widget shows every repository whose health is failed,
  warning or unknown, ordered across the overview by health severity, then
  by canonical repository name and platform. Each row
  shows the health symbol and text label, the shortened repository name
  linked to its repository page (REQ-0033), its organization as muted text
  when available, and one reason. Unknown health
  explains that the evidence status is unknown. Never integrated repositories
  show that state. Otherwise a reported FAIL or ERROR takes precedence over
  an overdue step and shows the verdict, shortened commit and relative ledger
  receipt time labeled "Reported". Overdue health without a failing verdict
  shows the reached and total configured steps. When no repository needs
  attention, the widget shows an all-clear message and the number checked.

  The Repository map presents one chip per repository identity in wrapping
  lists grouped by the owner segment of the repository identifier. When the
  overview has multiple organizations, each visible section has a heading
  below the map heading showing its organization and counts by health across
  the full overview. A single organization has no heading. A missing owner
  is shown as "No organization" when section headings are present. Sections
  are ordered by their worst health in the overview, then organization
  name. Within a section, chips are ordered by health severity, shortened
  repository name and platform. Text is compared by lower-cased code points,
  with case-only ties broken by original code points. A recognized status
  query filters only the map and hides sections with no matching chips.
  An absent or unrecognized value shows every repository. The current filter
  is visible and exposed to assistive
  technology. The map offers a link to clear it and explains when no
  repository matches. Each chip links to the repository page, shows the
  shortened name and a distinct health symbol, and names the full repository
  and health to assistive technology. Hover, keyboard focus and the first
  touch tap open the preview. Its controls are keyboard accessible. A second
  tap follows the repository link, as in REQ-0017.

  The preview names the full repository, owner, health, state and verdict
  where applicable. It labels unmanaged repositories "Not managed" and
  shows "No evidence" when there is no check verdict. When present, check
  evidence shows the shortened commit and relative ledger receipt time
  labeled "Reported". A pending or overdue head shows its shortened commit,
  the elapsed wait for evidence and the number of observed heads since
  evidence. Pending details use status-allowed, and overdue details use
  status-warning and name the reached and total steps. Commits are shortened
  to seven characters, with the full value available in a tooltip and
  accessible description when characters are omitted. Reported times expose the exact localized time
  the same way. When supplied, the latest release version links to REQ-0032
  and the latest deployment shows its target name and relative ledger receipt
  time. The target links to the deployment if an existing view can address
  it directly. The preview also shows the completed Rule Set links of
  REQ-0028.
  The Recent activity widget merges the newest attestations (CON-0003),
  releases (CON-0010) and deployments (CON-0013) by ledger receipt time,
  newest first, into at most ten entries. Entries with the same receipt time
  appear in the order attestation, release, deployment and then by
  identifier. Each entry shows the kind as symbol and text, the shortened
  repository linked to its repository page (REQ-0033), the key fact (the
  verdict of an attestation, the version of a release or the target name of
  a deployment) and the relative receipt time with the exact localized time
  available as an accessible description. An empty feed says so. When a read
  fails, the widget keeps the entries last received for that kind and names
  the kinds it could not read.

rationale: >-
  Viewers can identify missing or stale evidence and inspect the reported
  check verdict for each repository, including in large inventories.
