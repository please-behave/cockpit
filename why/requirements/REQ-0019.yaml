id: REQ-0019
name: Repository Dashboard
description: >-
  The landing page is a dashboard that loads the latest attestation summaries
  through CON-0001. A summary banner above the tiles states how many tiles pass and how many do
  not (FAIL or ERROR), as text with an icon, in the page heading size and with
  a stripe in the status color, and does not rely on color alone. The sort
  control shares its row, aligned to the end and wrapped below on narrow
  widths. It shows one tile
  for each repository and execution-point combination that
  ledger:CON-0002 returns, with the status, the repository owner above the
  shortened repository name, the first seven characters of the commit, the
  ledger receipt time labeled "Reported" and shown relative to now with the
  exact time as tooltip, followed in the same line by the rule count. The tile
  shows no counts of warnings or rules not run.
  The shortened name links to the attestation, and the whole tile follows that
  link. Execution points are shown only for a repository with more than one
  tile. An empty ledger has an explicit empty state.
rationale: >-
  Viewers see at a glance whether every repository passes and can reach the
  evidence of each head attestation.
decisions:
  - DEC-0001
  - DEC-0002
  - DEC-0010
  - DEC-0011
  - DEC-0012
