id: REQ-0024
name: Rule Result Verification
area: attestations
description: >-
  Wherever the cockpit shows rule results, it displays the verification
  supplied by the ledger under ledger:CON-0003, without computing it. It
  labels results Verified or Unverified. A tooltip and the label's accessible
  description explain what Verified means. For Unverified, they explain the
  reported reason, unregistered or mismatch. Both reasons use the same
  label and symbol. Verification describes the evidence separately from the
  reported rule outcome. Both verification states use the unframed label
  and symbol in the corresponding status color under REQ-0016. Viewers can
  inspect the source and path for registered rules on the linked rule detail.
rationale: >-
  Viewers can tell how far a reported result can be attributed to a known
  rule version.
decisions:
