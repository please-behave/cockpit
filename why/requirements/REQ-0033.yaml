id: REQ-0033
name: Repository Page
area: operations
description: >-
  A repository opens directly at /repositories/detail with its URL-encoded
  canonical name in the repository query parameter. The page shows the
  shortened name of REQ-0017 and the full canonical name. Its Completed
  Rule Sets section lists the repository's completed sets from CON-0006,
  as chips labeled "Name · major.minor" using their bound versions'
  display names and linking each to REQ-0029.
  It explains when there are no completed sets. Its Releases
  section lists that repository's releases under REQ-0030 through CON-0011.
  Existing /releases/repository addresses open the same repository page.
  The Deployments section reads all pages of current deployments through
  CON-0013 filtered by the exact canonical name. Its table shows one row per
  target owner and name, using the reference, release link when recorded, receipt
  time, reported evidence status and Rule Set summary of REQ-0034.
  Rows needing attention appear first. The section links to the Deployments tab.
  The Attestations section uses CON-0001 for the newest attestation of each
  execution-point combination in that repository, including a row for attestations without
  execution points when present. It shows up to 100 recent attestations through
  CON-0003, filtered by the exact canonical name and in ledger order. The rows
  show execution points, the reported time, commit and overall status, and the
  reported time links to the attestation detail. Each section explains when
  no records exist. Long names wrap within the available width or show their
  full value in a tooltip. All sections follow REQ-0004, REQ-0015 and REQ-0016. The attestation tables
  keep the time, commit and status on one line and follow REQ-0018 for scrolling.
  The latest combinations table can be sorted by execution points, reported
  time, commit or overall status under REQ-0018. The recent attestations table
  keeps ledger order.
rationale: Viewers can see a repository's reported runs, releases and deployment targets from a single address.
decisions:
