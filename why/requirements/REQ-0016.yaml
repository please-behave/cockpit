id: REQ-0016
name: Accessible Reported Statuses
area: identity
description: >-
  The cockpit never relies on color alone to convey an outcome. It displays
  known verdicts and rule statuses as Pass, Warn, Fail, Error or Not run,
  and missing evidence as No evidence. Outcome counts use the same labels
  without inflection. Each outcome, including verdicts, rule
  statuses and verification, uses an unframed visible label and an SVG symbol
  in the corresponding status color. PASS, FAIL, ERROR, WARN and NOT_RUN
  each use a distinct symbol. Unrecognized statuses retain their reported
  text with a neutral symbol and color. Shared status labels and badges use
  the pointer cursor and their labels cannot be selected as text. When a
  value has an explanation, the shared tooltip makes the value focusable
  and gives its trigger the explanation as an accessible description.
  The tooltip opens on hover, keyboard focus or tap and stays visible while
  the pointer or keyboard focus is within the trigger or popup. Viewers can
  dismiss it with Escape or a second tap. A popup adds information beyond
  its visible trigger. A text value or link label gets a popup with its full
  value only when the displayed text is shortened or clipped. The shared
  tooltip checks clipping when the value renders and when its size changes.
  A plain text value becomes focusable only while its popup is available.
rationale: >-
  Viewers can read reported outcomes regardless of color perception and can
  recognize values introduced by newer producers.
