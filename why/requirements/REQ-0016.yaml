id: REQ-0016
name: Accessible Reported Statuses
area: identity
description: >-
  The cockpit never relies on color alone to convey an outcome. It displays
  the status exactly as reported. PASS, FAIL, ERROR, WARN and NOT_RUN each
  have visible text and a distinct SVG symbol in addition to color. Unrecognized
  statuses retain their reported text with neutral styling. Status labels
  have a boxed presentation for standalone use and a compact presentation
  with the same text and symbol and no surrounding box. The verification
  reason in REQ-0024 is available through a tooltip and the accessible
  description of its focusable status label. The tooltip opens on hover,
  keyboard focus or tap and stays visible while the pointer moves into it.
  Viewers can dismiss it with Escape, and it closes when the focus or
  pointer that opened it moves away or the trigger is tapped again.
rationale: >-
  Viewers can read reported outcomes regardless of color perception and can
  recognize values introduced by newer producers.
decisions:
