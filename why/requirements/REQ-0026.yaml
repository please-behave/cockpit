id: REQ-0026
name: Registered Rule Views
description: >-
  The Rules navigation opens a paged list of registered rules from CON-0004.
  The list preserves the ledger's display-name order across pages and builds
  the next-page cursor from the last summary of each full page as CON-0004
  defines it. Each identity appears once with its name or local ID and any
  description, without a kind column. The description takes the remaining width
  and wraps without truncation. The table scrolls horizontally when necessary. Its detail page
  uses CON-0005. It uses the selected version's registered name or local ID as
  the headline, its description as an introduction when present, and a
  fact strip with Kind, Blocking for reviews, and Registered, in that
  order. Beneath the strip, three muted, labeled fields show Repository,
  Path and Rule ID and wrap on narrow screens. Repository shows the short
  name and exposes the full name in a tooltip. The detail shows one version in a
  panel and defaults to the newest. When several versions exist, a native
  keyboard-operable dropdown named Version lists them in descending numeric
  order with their registration times and marks the newest as Latest. The
  version query parameter selects the version on open. Changing the selection
  replaces the current history entry and preserves its origin. If the requested
  version is unavailable, the view shows a notice and displays the newest.
  The newest version's panel has a Latest badge and an accent stripe. The
  selected version shows its kind as a toned text badge, its description and
  registration time, and, for a review, its effective blocking value as a toned
  text badge. A review prompt has
  its own block and preserves line breaks. The detail displays
  known knowledge fields including purpose, problem, value, conditions and
  their reasons, success criteria, out of scope, limitations, placement and
  references. On wide screens, small muted labels sit beside the knowledge
  text. On narrow screens, labels sit above the text. The detail tolerates
  absent and unfamiliar fields and renders
  registered text as escaped plain text in both themes.
  The rule detail links back to the attestation when opened from an
  attestation result. The router keeps the source address in the history
  entry and follows browser history on ordinary activation, restoring the
  attestation's scroll position when returning to the loaded view. Modified
  clicks follow the link normally. Without an attestation origin, the
  detail links to the registered rules list.
rationale: >-
  Viewers can understand a rule's purpose and inspect what its owner
  registered for each version.
