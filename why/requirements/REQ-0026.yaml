id: REQ-0026
name: Registered Rule Views
area: registry
description: >-
  The Rules navigation opens two areas, registered Rule Sets and local rules
  grouped by source repository. The view reads registered rules and sets in
  ledger order with the cursors specified by CON-0004 and CON-0007. It uses
  the latest-version memberships reported by the ledger. A rule appears in
  each of those sets or, if it belongs to none, in its local repository group.
  The Rule Set header uses the shared Rule Set token and shows the display
  name, latest version, member count, distinct current repository count, and
  a text marker when any binding is incomplete according to CON-0008.
  Local repository headers use neutral tokens and start collapsed.
  Case-insensitive search matches rule names, rule IDs, set names and IDs,
  and source or bound repositories. It opens matching groups and shows only
  those groups. Viewers can combine search with a rule-kind filter and a
  Rule Set or local filter using labeled native controls. Search covers all
  registry pages, and the view reveals groups and their rules in batches.
  Within a group, rule summaries retain ledger order and show a link named
  with the display name or ID, the reported owner, and the description.
  The description wraps without truncation, and the table follows REQ-0018
  for scrolling. The list renders registered text as escaped
  plain text. The rule detail uses CON-0005 and uses the selected version's registered name or local ID as
  the headline, its description as an introduction when present, and a
  fact strip with Kind, Blocking for reviews, and Registered, in that
  order. Beneath the strip, three muted, labeled fields show Repository,
  Path and Rule ID and wrap on narrow screens. Repository shows the short
  name and exposes the full name in a tooltip. The "Part of" field shows one
  chip linking to each registered Rule Set version reported by CON-0005 for
  the selected rule version. With no memberships, it shows a repository chip
  linking to the rule's source when the source forms a valid HTTPS repository
  address. The chips follow REQ-0015. The detail shows one version in a
  widget and defaults to the newest. When several versions exist, a native
  keyboard-operable dropdown named Version lists them in descending numeric
  order with their registration times and marks the newest as Latest. The
  version query parameter selects the version on open. Changing the selection
  replaces the current history entry and preserves its origin. If the requested
  version is unavailable, the view shows a notice and displays the newest.
  The newest version's widget has a Latest badge and an accent stripe. The
  selected version shows its kind as a toned text badge, its description and
  registration time, its owner, and, for a review, its effective blocking
  value as a toned text badge. The Owner column and version widget render the
  reported owner as escaped plain text that wraps without truncation. When
  the owner is absent, the list shows a dash and the widget omits the field.
  A review prompt has
  its own block and preserves line breaks. The detail displays
  known knowledge fields including purpose, problem, value, conditions and
  their reasons, success criteria, out of scope, limitations, placement and
  references. On wide screens, small muted labels sit beside the knowledge
  text. On narrow screens, labels sit above the text. The detail tolerates
  absent and unfamiliar fields and renders
  registered text as escaped plain text in both themes.
  The rule detail links back to the attestation when opened from an
  attestation result. The router keeps the source address in the history
  entry and follows browser history on ordinary activation, restoring the
  attestation's scroll position when returning to the loaded view. Modified
  clicks follow the link normally. Without an attestation origin, the
  detail links to the registered rules list.
rationale: >-
  Viewers can understand a rule's purpose and inspect what its owner
  registered for each version.
