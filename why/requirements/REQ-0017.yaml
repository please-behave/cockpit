id: REQ-0017
name: Shortened Names
area: identity
description: >-
  Where the cockpit shortens a name, it shows the part after the last slash,
  or the whole value if there is none. The full repository name is
  the link's accessible name. REQ-0016 governs when its tooltip shows the
  full value. Hover or keyboard focus shows an available tooltip. On touch,
  the first tap opens an available tooltip and the second follows the link.
  A link without a popup follows on the first tap. The attestation detail shows
  the shortened repository name in its heading and the full name in the
  "Canonical name" field. Its rules table shows the shortened rule identifier.
rationale: >-
  Viewers recognize long names quickly without losing the exact reported
  value.
decisions:
  - DEC-0008
