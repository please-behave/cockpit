id: REQ-0017
name: Shortened Names
description: >-
  Where the cockpit shortens a name, it shows the part after the last slash,
  or the whole value if there is none. The full repository name is available
  in a tooltip on its link and as the link's accessible name. Hover or
  keyboard focus shows the tooltip. On touch, a tap on the shortened name
  shows it and a second tap follows the link. The attestation detail shows
  the shortened repository name in its heading and the full name in the
  "Canonical name" field. Its rules table shows the shortened rule identifier.
rationale: >-
  Viewers recognize long names quickly without losing the exact reported
  value.
decisions:
  - DEC-0008
