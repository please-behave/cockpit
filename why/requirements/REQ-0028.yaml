id: REQ-0028
name: Completed Rule Sets on the Dashboard
area: registry
description: >-
  On each dashboard load and refresh, the Cockpit reads completed shared Rule
  Sets by repository through CON-0006 alongside the repository overview.
  The Repository map preview in REQ-0019 shows one direct link per set for
  the repository. The preview stays open while the pointer or keyboard focus
  is on the trigger or preview. It closes on Escape or when both are left,
  with no time-based dismissal. Each linked chip labels the bound version
  as "Name · major.minor", makes the full label available, and links to that
  version on the Rule Set detail page of REQ-0029. Names render as escaped text.
  Repositories without completed sets show no Rule Set chips. The chips
  use the shared filled Rule Set tokens in both themes and system
  colors in forced-colors mode, and follow REQ-0015.
rationale: >-
  Viewers can see which shared Rule Sets a repository fully meets using the
  ledger's compliance definition and a color reserved for shared Rule Sets.
decisions:
  - DEC-0001
  - DEC-0006
  - why:DEC-0009
  - why:DEC-0019
