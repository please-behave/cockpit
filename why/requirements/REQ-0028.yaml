id: REQ-0028
name: Completed Rule Sets on the Dashboard
description: >-
  On each dashboard load and refresh, the Cockpit reads completed shared Rule
  Sets by repository through CON-0006 alongside the repository overview.
  Each tile and repository map preview shows one chip with the count of
  completed sets for its repository. The chip lists the bound versions'
  display names as plain text in an accessible tooltip. It links to the
  repository page of REQ-0033, which lists the completed sets. Tiles and
  previews for repositories without completed sets show no chip. The chip
  uses the filled platinum-blue Rule Set tokens in both themes and system
  colors in forced-colors mode, and follows REQ-0015.
rationale: >-
  Viewers can see which shared Rule Sets a repository fully meets using the
  ledger's compliance definition and a color reserved for shared Rule Sets.
decisions:
  - DEC-0001
  - DEC-0006
  - why:DEC-0009
  - why:DEC-0019
