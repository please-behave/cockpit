id: REQ-0012
name: Browser API Sessions
description: >-
  The browser API read endpoints require the live session and current
  authorization defined by REQ-0007. If either is absent, the endpoint returns
  HTTP 401 without a redirect, before contacting the ledger. The frontend sends
  the viewer to sign-in on HTTP 401.
rationale: >-
  Browser code needs to recognize a session that cannot access the API.
decisions:
  - DEC-0004
