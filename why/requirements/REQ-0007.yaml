id: REQ-0007
name: Viewer Sessions
area: authentication
description: >-
  Page requests require a live session for a currently allowed user ID and
  redirect to sign-in otherwise. Health and sign-in routes and embedded assets
  are public. Browser API sessions follow REQ-0012. Authenticated page requests
  serve the frontend shell with HTTP 200, including deep links and unknown
  page addresses. The frontend reports unknown pages and uses browser history
  for navigation. Each view sets the document title and focuses its main
  heading on navigation. A session carries the user ID and expiry in an
  authenticated and encrypted cookie with Secure, HttpOnly, SameSite=Lax and
  Path=/ attributes. Sessions expire after eight hours and require no shared
  session storage. Same-origin sign-out clears the session cookie from the
  browser.
rationale: >-
  A viewer can use multiple cockpit instances during a session while access
  remains bounded in time and restricted to authorized viewers.
decisions:
  - DEC-0004
