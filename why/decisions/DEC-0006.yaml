id: DEC-0006
name: Layered Design Tokens
context: >-
  The application shell and static pages need a common styling foundation that
  follows the [shared identity](https://github.com/please-behave/why/blob/main/why/decisions/DEC-0009.yaml).
decision: >-
  Keep semantic colors and shared spacing, typography, radius, and elevation
  values in CSS custom properties. Order styles in the tokens, base,
  components, and utilities cascade layers. Declare literal colors only in
  the tokens layer and use the system font stack and browser color scheme.
  Build the common stylesheet with Vite and use adopted stylesheets in
  Shadow DOM components.
rationale: >-
  Shared tokens allow the same visual and accessibility choices to apply to
  static pages and components across themes.
