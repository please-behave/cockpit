id: COMP-0010
name: Registry Views
purpose: "Shows registered rules and rule sets and links results to the registered versions."
scope:
  - "Lists registered rules and shows their versions."
  - "Shows the detail of a registered rule set."
  - "Names the bound version of a completed rule set and links to it."
out_of_scope:
  - description: "Attestation results that cite a version."
    owner: COMP-0009
must_not:
  - "Show a version that the ledger did not report."
files:
