  - frontend/src/components/pb-rule-set-summary.ts
  - frontend/src/views/registry-version.ts
  - frontend/src/views/rule-set.ts
  - frontend/src/views/rule.ts
  - frontend/src/views/rules.ts
depends_on:
  - COMP-0005
  - COMP-0006
  - COMP-0008
  - COMP-0009
requirements:
  - REQ-0020
  - REQ-0024
  - REQ-0025
  - REQ-0026
  - REQ-0027
  - REQ-0028
  - REQ-0029
