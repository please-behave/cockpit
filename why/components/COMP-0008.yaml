id: COMP-0008
name: Shared Presentation Components
purpose: "Provides the reusable pb-* building blocks that views compose."
scope:
  - "Renders statuses with text and symbol, times, shortened names, commit links, tooltips, tables, sections and states."
  - "Detects shortened and clipped text and reveals its full value on hover, focus and touch."
  - "Bounds table columns and keeps headers visible on scroll."
out_of_scope:
  - description: "Loading data."
    owner: COMP-0005
  - description: "Topic-specific layout of a page."
    owner: COMP-0009
must_not:
  - "Depend on a view."
  - "Rely on color alone to convey an outcome."
files:
  - frontend/src/commit-link.ts
  - frontend/src/components/pb-badge.ts
  - frontend/src/components/pb-commit-link.ts
  - frontend/src/components/pb-data-table.ts
  - frontend/src/components/pb-empty-state.ts
  - frontend/src/components/pb-error-state.ts
  - frontend/src/components/pb-fact-strip.ts
  - frontend/src/components/pb-key-value.ts
  - frontend/src/components/pb-relative-time.ts
  - frontend/src/components/pb-repo-chip.ts
  - frontend/src/components/pb-section.ts
  - frontend/src/components/pb-short-name.ts
  - frontend/src/components/pb-stat-tile.ts
  - frontend/src/components/pb-status-pill.ts
  - frontend/src/components/pb-time.ts
  - frontend/src/components/pb-tooltip.ts
  - frontend/src/components/pb-widget.ts
  - frontend/src/components/state-panel.ts
  - frontend/src/components/value-explanations.ts
  - frontend/src/status-pill-preview.ts
depends_on:
