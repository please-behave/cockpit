id: COMP-0007
name: Visual Identity and Theme
purpose: "Provides the shared look, the icon set and the light and dark theme choice."
scope:
  - "Defines design tokens, base styles and the shared adopted stylesheets."
  - "Resolves, applies and remembers the theme, following the system theme until the viewer chooses."
  - "Offers the theme toggle and the icon set."
out_of_scope:
  - description: "Layout and behavior of a view."
    owner: COMP-0009
must_not:
  - "Use inline scripts or inline styles."
  - "Fail when browser storage is blocked."
files:
  - frontend/src/components/icons.ts
  - frontend/src/components/pb-icon.ts
  - frontend/src/components/pb-theme-toggle.ts
  - frontend/src/styles/controls.ts
  - frontend/src/styles/disclosure.ts
  - frontend/src/styles/links.ts
  - frontend/src/styles/main.css
  - frontend/src/styles/text.ts
  - frontend/src/styles/tokens.css
  - frontend/src/theme-init.ts
  - frontend/src/theme.ts
depends_on:
  - COMP-0008
requirements:
  - REQ-0015
  - REQ-0016
  - REQ-0023
